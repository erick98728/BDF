name: Fase 4 - Etapa 2 - Movimento

on:
  push:
    branches:
      - agent/fase-4-etapa-2-simplificacao-movimento
  pull_request:
    branches:
      - main
    paths:
      - src/app/effects.css
      - src/app/galeria/page.tsx
      - src/app/layout.tsx
      - src/app/motion-system.css
      - src/app/motion-refinements.css
      - src/app/motion-optimization.css
      - src/components/BackgroundFog.tsx
      - src/components/CursorAura.tsx
      - src/components/DockMenu.tsx
      - src/components/GalleryModal.tsx
      - src/components/HeroSection.tsx
      - src/components/ImpactEffects.tsx
      - src/components/RouteTransition.tsx
      - src/components/ScrollTimeline.tsx
      - src/lib/motion.ts
      - scripts/validate-motion-etapa-2.mjs
      - scripts/validate-motion-etapa-2-final.mjs
      - scripts/validate-cls-etapa-3.mjs
      - scripts/capture-motion-etapa-2-samples.mjs
      - docs/fase-4/etapa-2/**
      - .github/workflows/fase-4-etapa-2-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fase-4-etapa-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, ESLint, build e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar whitespace do diff
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --check FETCH_HEAD HEAD --

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalação limpa
        run: npm ci

      - name: Testes existentes
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "Nenhum script de teste existente foi declarado no package.json."
          fi

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: ESLint
        run: npx eslint src scripts

      - name: Build de produção
        run: npm run build

      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar build local
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/bdf-etapa-2-server.log 2>&1 &
          echo $! > /tmp/bdf-etapa-2-server.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bdf-etapa-2-server.log
          exit 1

      - name: Validar movimento funcional no navegador
        env:
          MOTION_VALIDATION_URL: http://127.0.0.1:3000
          MOTION_VALIDATION_OUTPUT: artifacts/fase-4-etapa-2
        run: |
          set +e
          node scripts/validate-motion-etapa-2-final.mjs
          MOTION_EXIT_CODE=$?
          set -e

          MOTION_EXIT_CODE="$MOTION_EXIT_CODE" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const reportPath =
            "artifacts/fase-4-etapa-2/motion-validation.json";
          if (!fs.existsSync(reportPath)) {
            console.error(
              "O validador de movimento não gerou motion-validation.json.",
            );
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const summary = report.summary || {};
          const diagnostics = Array.isArray(report.errors) ? report.errors : [];
          const clsDiagnostics = diagnostics.filter(
            (error) =>
              error.startsWith("CLS@") || error.startsWith("CLS-route@"),
          );
          const functionalErrors = diagnostics.filter(
            (error) =>
              !error.startsWith("CLS@") && !error.startsWith("CLS-route@"),
          );

          const expectedCases = summary.expectedRouteWidthCases ?? 170;
          if (summary.routeWidthCases !== expectedCases) {
            functionalErrors.push(
              `Matriz funcional incompleta: ${summary.routeWidthCases} de ${expectedCases} casos.`,
            );
          }
          if ((summary.casesWithPendingReveals ?? 0) !== 0) {
            functionalErrors.push(
              `Reveals pendentes: ${summary.casesWithPendingReveals}.`,
            );
          }
          if ((summary.casesWithInfiniteAnimations ?? 0) !== 0) {
            functionalErrors.push(
              `Animações infinitas: ${summary.casesWithInfiniteAnimations}.`,
            );
          }
          if ((summary.casesWithFixedBackgrounds ?? 0) !== 0) {
            functionalErrors.push(
              `Backgrounds fixos: ${summary.casesWithFixedBackgrounds}.`,
            );
          }
          if ((summary.maxRectCallsDuringFastScroll ?? 0) > 16) {
            functionalErrors.push(
              `Leituras geométricas acima do limite: ${summary.maxRectCallsDuringFastScroll}.`,
            );
          }

          const exitCode = Number.parseInt(
            process.env.MOTION_EXIT_CODE || "0",
            10,
          );
          if (exitCode !== 0 && diagnostics.length === 0) {
            functionalErrors.push(
              `O validador terminou com código ${exitCode} sem diagnóstico estruturado.`,
            );
          }

          console.log(
            JSON.stringify(
              {
                routeWidthCases: summary.routeWidthCases,
                expectedRouteWidthCases: expectedCases,
                functionalErrors: functionalErrors.length,
                pendingReveals: summary.casesWithPendingReveals ?? 0,
                infiniteAnimations:
                  summary.casesWithInfiniteAnimations ?? 0,
                fixedBackgrounds: summary.casesWithFixedBackgrounds ?? 0,
                maxRectCallsDuringFastScroll:
                  summary.maxRectCallsDuringFastScroll ?? null,
                clsDiagnostics,
                clsAuthority:
                  "scripts/validate-cls-etapa-3.mjs",
              },
              null,
              2,
            ),
          );

          if (functionalErrors.length) {
            console.error(functionalErrors.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Validar CLS autoritativo da Etapa 3
        env:
          ETAPA3_VALIDATION_URL: http://127.0.0.1:3000
          ETAPA3_BASELINE_URL: https://bdf-navy.vercel.app
          ETAPA3_VALIDATION_OUTPUT: artifacts/fase-4-etapa-2/cls-authoritative
          ETAPA3_CLS_SAMPLES: 3
        run: node scripts/validate-cls-etapa-3.mjs

      - name: Capturar evidências comparativas
        env:
          MOTION_VALIDATION_URL: http://127.0.0.1:3000
          MOTION_VALIDATION_OUTPUT: artifacts/fase-4-etapa-2
        run: node scripts/capture-motion-etapa-2-samples.mjs

      - name: Encerrar servidor e preservar log
        if: always()
        run: |
          if [ -f /tmp/bdf-etapa-2-server.pid ]; then
            kill "$(cat /tmp/bdf-etapa-2-server.pid)" 2>/dev/null || true
          fi
          mkdir -p artifacts/fase-4-etapa-2
          if [ -f /tmp/bdf-etapa-2-server.log ]; then
            cp /tmp/bdf-etapa-2-server.log artifacts/fase-4-etapa-2/server.log
          fi

      - name: Publicar relatório direcionado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-4-etapa-2-motion-validation
          path: artifacts/fase-4-etapa-2
          if-no-files-found: warn
          retention-days: 30
