name: Fase 4 - Etapa 2 - Movimento

on:
  push:
    branches:
      - agent/fase-4-etapa-2-simplificacao-movimento
  pull_request:
    branches:
      - main
    paths:
      - src/app/effects.css
      - src/app/layout.tsx
      - src/app/motion-system.css
      - src/app/motion-refinements.css
      - src/app/motion-optimization.css
      - src/components/BackgroundFog.tsx
      - src/components/CursorAura.tsx
      - src/components/HeroSection.tsx
      - src/components/ImpactEffects.tsx
      - src/components/RouteTransition.tsx
      - src/lib/motion.ts
      - scripts/validate-motion-etapa-2.mjs
      - .github/workflows/fase-4-etapa-2-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fase-4-etapa-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, ESLint, build e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: ESLint
        run: npx eslint .

      - name: Build de produção
        run: npm run build

      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar build local
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/bdf-etapa-2-server.log 2>&1 &
          echo $! > /tmp/bdf-etapa-2-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bdf-etapa-2-server.log
          exit 1

      - name: Validar movimento no navegador
        env:
          MOTION_VALIDATION_URL: http://127.0.0.1:3000
          MOTION_VALIDATION_OUTPUT: artifacts/fase-4-etapa-2
        run: node scripts/validate-motion-etapa-2.mjs

      - name: Encerrar servidor
        if: always()
        run: |
          if [ -f /tmp/bdf-etapa-2-server.pid ]; then
            kill "$(cat /tmp/bdf-etapa-2-server.pid)" 2>/dev/null || true
          fi

      - name: Publicar relatório direcionado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-4-etapa-2-motion-validation
          path: |
            artifacts/fase-4-etapa-2
            /tmp/bdf-etapa-2-server.log
          if-no-files-found: warn
          retention-days: 30
